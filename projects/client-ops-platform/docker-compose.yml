services:
  postgres:
    image: postgres:16-alpine
    container_name: client-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clientops
      POSTGRES_USER: clientops
      POSTGRES_PASSWORD: clientops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientops -d clientops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
